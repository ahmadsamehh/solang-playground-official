name: Docker CI

on:
  push:
    branches:
      - develop
      - develop-restore
      - feat/docker-workflow
      - automation
  pull_request:
    branches:
      - develop
      - develop-restore
      - feat/docker-workflow
      - automation

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install dependencies inside packages/frontend
        run: |
          cd packages/frontend
          npm install --no-workspaces

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo make
        run: cargo install cargo-make

      - name: Get Sysbox
        run: wget https://downloads.nestybox.com/sysbox/releases/v0.6.1/sysbox-ce_0.6.1-0.linux_amd64.deb

      - name: Install Sysbox
        run: sudo apt-get update && sudo apt-get install -y ./sysbox-ce_0.6.1-0.linux_amd64.deb

      - name: Configure Sysbox runtime
        run: sudo mkdir -p /etc/docker && sudo cp sysbox/daemon.json /etc/docker/daemon.json

      - name: Restart docker service
        run: sudo systemctl restart docker.service

      - name: Build docker image
        run: docker build -t zsolangpgtest -f Dockerfile .

      - name: Run docker container in detached mode
        run: docker run --runtime=sysbox-runc -d -p 4444:4444 -p 3000:3000 --name zsolangpg_backend zsolangpgtest

      - name: Download wait-for-it.sh
        run: wget https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh && chmod +x wait-for-it.sh

      - name: Wait for backend server (port 4444)
        run: |
          echo "Waiting for backend server on localhost:4444..."
          ./wait-for-it.sh localhost:4444 -t 180 -- echo "Backend server (4444) is up!"
          if [ $? -ne 0 ]; then
            echo "Timeout waiting for backend server (4444)."
            docker logs zsolangpg_backend
            exit 1
          fi

      - name: Wait for frontend server (port 3000)
        run: |
          echo "Waiting for frontend server on localhost:3000..."
          ./wait-for-it.sh localhost:3000 -t 180 -- echo "Frontend server (3000) is up!"
          if [ $? -ne 0 ]; then
            echo "Timeout waiting for frontend server (3000)."
            docker logs zsolangpg_backend
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag & Push Docker image to Docker Hub on push
        if: github.event_name == 'push'
        run: |
          docker tag zsolangpgtest ahmadsamehh/zsolangpgtest:latest
          docker push ahmadsamehh/zsolangpgtest:latest

      - name: Tag and Push Docker image (pull request event)
        if: github.event_name == 'pull_request'
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          docker tag zsolangpgtest ahmadsamehh/zsolangpgtest:pr-$PR_NUMBER
          docker push ahmadsamehh/zsolangpgtest:pr-$PR_NUMBER

      # ---------- NEW PART: AWS SSM Deployment ----------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }} # e.g. us-east-1

      - name: Run automation script on AWS EC2 instance via SSM
        run: |
          INSTANCE_ID=${{ secrets.AWS_SSM_INSTANCE_ID }}
          SCRIPT_PATH="/home/ubuntu/finalall-test.sh"

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Run finalall-test.sh script" \
            --parameters "commands=['bash $SCRIPT_PATH']" \
            --region ${{ secrets.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "✅ Sent SSM command with ID: $COMMAND_ID"

          # Optional: Fetch logs from SSM to verify script execution
          sleep 10
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --region ${{ secrets.AWS_REGION }} \
            --details \
            --query "CommandInvocations[].CommandPlugins[].Output" \
            --output text
